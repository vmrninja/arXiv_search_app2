<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>arXiv Paper Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .search-box {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        #searchInput {
            flex: 1;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        #searchInput:focus {
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .options {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
        }

        .option-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        label {
            font-weight: 500;
            color: #555;
        }

        select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            border-color: #667eea;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }

        .spinner {
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: grid;
            gap: 20px;
        }

        .paper-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .paper-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }

        .paper-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .paper-title a {
            color: #667eea;
            text-decoration: none;
            transition: color 0.2s;
        }

        .paper-title a:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .paper-authors {
            color: #666;
            margin-bottom: 8px;
            font-size: 0.95rem;
        }

        .paper-date {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 12px;
        }

        .paper-abstract {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .paper-links {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .paper-link {
            display: inline-block;
            padding: 8px 16px;
            background: #f0f0f0;
            color: #667eea;
            text-decoration: none;
            border-radius: 6px;
            font-size: 0.9rem;
            font-weight: 500;
            transition: background 0.2s;
        }

        .paper-link:hover {
            background: #e0e0e0;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .no-results-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .no-results h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .no-results p {
            color: #666;
        }

        .error {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            color: #856404;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .search-form {
                flex-direction: column;
            }

            .options {
                flex-direction: column;
                align-items: flex-start;
            }

            .paper-card {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 arXiv Paper Search</h1>
            <p class="subtitle">Search through millions of scientific papers</p>
        </header>

        <div class="search-box">
            <form class="search-form" id="searchForm">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Search for papers (e.g., quantum computing, neural networks...)"
                    required
                />
                <button type="submit" id="searchBtn">Search</button>
            </form>
            
            <div class="options">
                <div class="option-group">
                    <label for="searchField">Search in:</label>
                    <select id="searchField">
                        <option value="all">All fields</option>
                        <option value="ti">Title</option>
                        <option value="au">Author</option>
                        <option value="abs">Abstract</option>
                    </select>
                </div>
                
                <div class="option-group">
                    <label for="sortBy">Sort by:</label>
                    <select id="sortBy">
                        <option value="relevance">Relevance</option>
                        <option value="lastUpdatedDate">Last Updated</option>
                        <option value="submittedDate">Submitted Date</option>
                    </select>
                </div>
                
                <div class="option-group">
                    <label for="maxResults">Results:</label>
                    <select id="maxResults">
                        <option value="10">10</option>
                        <option value="25" selected>25</option>
                        <option value="50">50</option>
                    </select>
                </div>
            </div>
        </div>

        <div id="loadingIndicator" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Searching arXiv...</p>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <script>
        const searchForm = document.getElementById('searchForm');
        const searchInput = document.getElementById('searchInput');
        const searchBtn = document.getElementById('searchBtn');
        const searchField = document.getElementById('searchField');
        const sortBy = document.getElementById('sortBy');
        const maxResults = document.getElementById('maxResults');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const resultsContainer = document.getElementById('resultsContainer');

        searchForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await searchArxiv();
        });

        async function searchArxiv() {
            const query = searchInput.value.trim();
            if (!query) return;

            const field = searchField.value;
            const sort = sortBy.value;
            const max = maxResults.value;

            // Show loading
            loadingIndicator.style.display = 'block';
            resultsContainer.innerHTML = '';
            searchBtn.disabled = true;

            try {
                // Use local backend server
                const apiUrl = `http://localhost:5000/api/search?query=${encodeURIComponent(query)}&field=${field}&sortBy=${sort}&maxResults=${max}`;

                const response = await fetch(apiUrl);
                const data = await response.json();
                
                if (!data.success) {
                    throw new Error(data.error || 'Search failed');
                }
                
                if (data.papers.length === 0) {
                    displayNoResults();
                } else {
                    displayResults(data.papers);
                }
            } catch (error) {
                displayError(error.message);
            } finally {
                loadingIndicator.style.display = 'none';
                searchBtn.disabled = false;
            }
        }

        function displayResults(papers) {
            const resultsHTML = papers.map(paper => {
                const title = paper.title || 'No title';
                const summary = paper.summary || 'No abstract available';
                const published = paper.published || '';
                const id = paper.id || '';
                
                // Get authors
                const authors = paper.authors.join(', ');

                // Extract arXiv ID from the id URL
                const arxivId = id.split('/abs/')[1] || '';
                const pdfLink = `https://arxiv.org/pdf/${arxivId}.pdf`;
                const absLink = `https://arxiv.org/abs/${arxivId}`;

                const publishedDate = new Date(published).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                return `
                    <div class="paper-card">
                        <h2 class="paper-title">
                            <a href="${absLink}" target="_blank" rel="noopener noreferrer">${title}</a>
                        </h2>
                        <div class="paper-authors"><strong>Authors:</strong> ${authors || 'Unknown'}</div>
                        <div class="paper-date"><strong>Published:</strong> ${publishedDate}</div>
                        <div class="paper-abstract">${summary}</div>
                        <div class="paper-links">
                            <a href="${absLink}" target="_blank" rel="noopener noreferrer" class="paper-link">View Abstract</a>
                            <a href="${pdfLink}" target="_blank" rel="noopener noreferrer" class="paper-link">Download PDF</a>
                        </div>
                    </div>
                `;
            }).join('');

            resultsContainer.innerHTML = `<div class="results">${resultsHTML}</div>`;
        }

        function displayNoResults() {
            resultsContainer.innerHTML = `
                <div class="no-results">
                    <div class="no-results-icon">🔍</div>
                    <h2>No papers found</h2>
                    <p>Try adjusting your search terms or filters</p>
                </div>
            `;
        }

        function displayError(message) {
            resultsContainer.innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${message}. Please try again.
                </div>
            `;
        }

        // Initial focus on search input
        searchInput.focus();
    </script>
</body>
</html>
